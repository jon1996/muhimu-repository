# Stack bêta / staging isolée — ne remplace pas docker-compose.yml (dev).
# Usage :
#   ./deploy/beta/generate-certs.sh
#   cp .env.beta.example .env.beta   # puis éditer les secrets
#   docker compose -p muhimu-beta -f docker-compose.beta.yml --env-file .env.beta up -d --build
#
# Aucun port PostgreSQL / Redis / API interne exposé sur l'hôte.
# Seul le reverse proxy (80/443) est publié.

name: muhimu-beta

services:
  db:
    image: postgres:16-alpine
    # env_file only — avoids host-shell POSTGRES_* (dev) overriding beta init.
    env_file:
      - .env.beta
    volumes:
      - postgres_beta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - beta_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - beta_internal
    restart: unless-stopped

  migrate:
    image: muhimu-beta-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_ROLE: erp
    entrypoint: ["./scripts/entrypoint_migrate.sh"]
    env_file:
      - .env.beta
    environment:
      APP_ROLE: erp
      DJANGO_DEBUG: "0"
      BOOTSTRAP_LOCAL_ACCOUNTS: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Identifiants PostgreSQL : .env.beta uniquement (évite POSTGRES_* du shell hôte).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - beta_internal
    restart: "no"

  backend:
    image: muhimu-beta-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_ROLE: erp
    command: ["sh", "scripts/entrypoint_web.sh"]
    env_file:
      - .env.beta
    environment:
      APP_ROLE: erp
      DJANGO_DEBUG: "0"
      BOOTSTRAP_LOCAL_ACCOUNTS: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Runtime ERP : muhimu_app via .env.beta (NOBYPASSRLS)
      REDIS_URL: redis://redis:6379/0
    volumes:
      - beta_media:/app/media
      - beta_static:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - beta_internal
    restart: unless-stopped

  platform:
    image: muhimu-beta-platform-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_ROLE: platform
    command: ["sh", "scripts/entrypoint_web.sh"]
    env_file:
      - .env.beta
    environment:
      APP_ROLE: platform
      DJANGO_DEBUG: "0"
      BOOTSTRAP_LOCAL_ACCOUNTS: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - beta_media:/app/media
      - beta_static:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - beta_internal
    restart: unless-stopped

  frontend:
    image: muhimu-beta-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        API_INTERNAL_URL: http://backend:8000
    environment:
      API_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - beta_internal
    restart: unless-stopped

  console:
    image: muhimu-beta-console
    build:
      context: ./console
      dockerfile: Dockerfile
      target: production
      args:
        API_INTERNAL_URL: http://platform:8000
    environment:
      API_INTERNAL_URL: http://platform:8000
      NODE_ENV: production
    depends_on:
      platform:
        condition: service_healthy
    networks:
      - beta_internal
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      # BETA-UAT-02 : loopback only — pas d'exposition LAN large.
      - "127.0.0.1:${BETA_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${BETA_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/beta/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/beta/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - console
      - backend
      - platform
    networks:
      - beta_internal
    restart: unless-stopped

networks:
  beta_internal:
    driver: bridge

volumes:
  postgres_beta_data:
  beta_media:
  beta_static:
