# Reverse proxy bêta — HTTPS local (certificats self-signed uniquement).
# Ne pas utiliser ces certificats en production publique.

upstream erp_web { server frontend:3000; }
upstream erp_api { server backend:8000; }
upstream console_web { server console:3000; }
upstream console_api { server platform:8000; }

server {
    listen 80;
    server_name erp.beta.localhost console.beta.localhost localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp.beta.localhost localhost;

    ssl_certificate     /etc/nginx/certs/beta.crt;
    ssl_certificate_key /etc/nginx/certs/beta.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Interfaces DB / Redis / runserver non exposées via ce proxy.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://erp_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://erp_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name console.beta.localhost;

    ssl_certificate     /etc/nginx/certs/beta.crt;
    ssl_certificate_key /etc/nginx/certs/beta.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://console_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://console_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
