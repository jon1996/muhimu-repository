<!DOCTYPE html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#f4f7fb;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#0b1220;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#0A66FF;padding:20px 28px;color:#ffffff;">
                <p style="margin:0;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;">Muhimu</p>
                <p style="margin:6px 0 0;font-size:22px;font-weight:600;">Test d'envoi</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;font-size:15px;line-height:1.5;">
                <p style="margin:0 0 16px;">Ceci est un e-mail de test envoyé depuis la console SaaS.</p>
                <p style="margin:0 0 8px;"><strong>Destinataire :</strong> {{ to }}</p>
                <p style="margin:0 0 8px;"><strong>Expéditeur :</strong> {{ from_email }}</p>
                <p style="margin:0;"><strong>Serveur :</strong> {{ host }}:{{ port }} (mode {{ mode }})</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:11px;color:#8a93a5;">© {{ year }} Muhimu</p>
        </td>
      </tr>
    </table>
  </body>
</html>
