# Répétition ACC-03 — restauration dump DEV + migrate 0033 (isolé).
# Projet : muhimu-acc03-promote — hors muhimuerp / muhimu-beta / ops-restore.
# down sans -v conserve le volume jusqu'à autorisation.

name: muhimu-acc03-promote

services:
  db_promote:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muhimu
      POSTGRES_PASSWORD: ${ACC03_PROMOTE_PG_PASSWORD:-acc03_promote_lab_only}
      POSTGRES_DB: muhimu_promote
    volumes:
      - acc03_promote_pgdata:/var/lib/postgresql/data
      - ./backups/postgres:/backups:ro
    ports:
      - "${ACC03_PROMOTE_PG_PORT:-5441}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muhimu -d muhimu_promote"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - promote_net

  test_runner:
    image: muhimu-erp-api
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: db_promote
      POSTGRES_PORT: "5432"
      POSTGRES_DB: muhimu_promote
      POSTGRES_USER: muhimu
      POSTGRES_PASSWORD: ${ACC03_PROMOTE_PG_PASSWORD:-acc03_promote_lab_only}
      POSTGRES_APP_USER: muhimu_app
      POSTGRES_APP_PASSWORD: ${ACC03_PROMOTE_PG_PASSWORD:-acc03_promote_lab_only}
      POSTGRES_PLATFORM_USER: muhimu_platform
      POSTGRES_PLATFORM_PASSWORD: ${ACC03_PROMOTE_PG_PASSWORD:-acc03_promote_lab_only}
      SECRET_KEY: acc03-promote-secret-not-for-prod
      DEBUG: "1"
      APP_ROLE: erp
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db_promote:
        condition: service_healthy
    networks:
      - promote_net

volumes:
  acc03_promote_pgdata:
    name: muhimu_acc03_promote_pgdata

networks:
  promote_net:
    name: muhimu_acc03_promote_net
