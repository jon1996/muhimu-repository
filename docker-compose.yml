services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muhimu
      POSTGRES_PASSWORD: muhimu
      POSTGRES_DB: muhimu
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muhimu -d muhimu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Profil DÉVELOPPEMENT uniquement.
  # Bêta / staging : docker-compose.beta.yml (Gunicorn, DEBUG=0, sans bootstrap).
  backend:
    image: muhimu-erp-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
      args:
        APP_ROLE: erp
    command: >
      sh -c "python manage.py migrate &&
             python manage.py bootstrap_demo &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      APP_ROLE: erp
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: muhimu
      POSTGRES_USER: muhimu
      POSTGRES_PASSWORD: muhimu
      POSTGRES_APP_USER: muhimu_app
      POSTGRES_APP_PASSWORD: muhimu
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,platform
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
      ERP_PUBLIC_URL: http://127.0.0.1:3001
      BOOTSTRAP_LOCAL_ACCOUNTS: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: muhimu-erp-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_DEV_PREFILL: "1"
    depends_on:
      backend:
        condition: service_healthy

  platform:
    image: muhimu-platform-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
      args:
        APP_ROLE: platform
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      APP_ROLE: platform
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: muhimu
      POSTGRES_USER: muhimu
      POSTGRES_PASSWORD: muhimu
      POSTGRES_APP_USER: muhimu_app
      POSTGRES_APP_PASSWORD: muhimu
      POSTGRES_PLATFORM_USER: muhimu_platform
      POSTGRES_PLATFORM_PASSWORD: muhimu
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,platform
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
      ERP_PUBLIC_URL: http://127.0.0.1:3001
      CONSOLE_PUBLIC_URL: http://127.0.0.1:3002
      BOOTSTRAP_LOCAL_ACCOUNTS: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy

  console:
    image: muhimu-platform-web
    build:
      context: ./console
      dockerfile: Dockerfile
      target: development
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./console:/app
      - console_node_modules:/app/node_modules
    ports:
      - "3002:3000"
    environment:
      API_INTERNAL_URL: http://platform:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_DEV_PREFILL: "1"
    depends_on:
      platform:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  console_node_modules:
